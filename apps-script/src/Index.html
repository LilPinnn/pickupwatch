<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255,255,255,.86);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --blue: #0071e3;
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --shadow: 0 10px 35px rgba(0,0,0,.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% -20%, #fff 0, #f5f5f7 45%, #eeeef0 100%);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      background: rgba(255,255,255,.78);
      border-bottom: 1px solid rgba(210,210,215,.75);
    }

    .topbar-inner {
      max-width: 1250px;
      margin: auto;
      padding: 13px 20px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -.5px;
      margin-right: auto;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      background: #e8e8ed;
      padding: 4px;
      border-radius: 999px;
    }

    .nav-tab {
      background: transparent;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      color: var(--muted);
      transition: all .2s;
    }

    .nav-tab.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .control {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
    }

    select, input, button { font: inherit; }

    select, input[type="text"], input[type="url"], input[type="password"] {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px 12px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,113,227,.12);
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 15px;
      cursor: pointer;
      transition: .18s;
      font-weight: 600;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-secondary { background: #e8e8ed; color: var(--text); }
    .btn-danger { background: #ffe5e3; color: #c7251d; }

    .status-pill {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    main {
      max-width: 1250px;
      margin: 0 auto;
      padding: 34px 20px 70px;
    }

    .view-section { display: none; }
    .view-section.active { display: block; }

    /* LOGIN */
    #view-login.active {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 70px);
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid rgba(210,210,215,.85);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .login-card h2 { margin: 0 0 4px; font-size: 24px; }
    .login-card p { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; }
    .login-card label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    .login-card input { width: 100%; }
    .login-card .btn { width: 100%; margin-top: 20px; }
    .login-error { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.03;
      margin: 10px 0;
      letter-spacing: -2px;
    }

    .hero p {
      color: var(--muted);
      margin: 0;
      font-size: 16px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(210,210,215,.85);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .product-image {
      position: relative;
      height: 250px;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image a {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 22px;
      transition: transform .3s;
    }
    .product-image a:hover img { transform: scale(1.03); }

    .image-placeholder {
      color: #aaa;
      font-size: 14px;
    }

    .overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      text-align: center;
      font-size: clamp(22px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -1px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,.8), 0 5px 20px rgba(0,0,0,.45);
      pointer-events: none;
      white-space: pre-wrap;
    }

    .card-body { padding: 19px; }

    .product-name {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.5px;
      margin-bottom: 4px;
    }

    .sku {
      color: var(--muted);
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .history-info {
      margin-top: 10px;
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(0,0,0,.02);
      padding: 8px 10px;
      border-radius: 10px;
    }

    .availability {
      margin-top: 14px;
      padding: 12px 15px;
      border-radius: 16px;
      background: #f2f2f7;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #999;
      flex: 0 0 auto;
    }

    .dot.green { background: var(--green); }
    .dot.red { background: var(--red); }
    .dot.orange { background: var(--orange); }

    .stores {
      margin-top: 13px;
      display: grid;
      gap: 8px;
    }

    .store {
      padding: 11px 12px;
      background: #fff;
      border: 1px solid #e5e5e7;
      border-radius: 13px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .store-name { font-weight: 600; }
    .store-status { color: var(--muted); text-align: right; }

    .editor-container {
      background: rgba(255,255,255,.85);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .editor-container h2 { margin: 0 0 5px; font-size: 24px; }
    .editor-container p { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; }

    .product-row {
      display: grid;
      grid-template-columns: 25px 1.2fr 1fr 1.2fr 1.2fr 1.2fr auto;
      gap: 9px;
      align-items: center;
      margin-bottom: 10px;
      background: #fff;
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 14px;
    }

    .product-row input { width: 100%; }

    .footer-note {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-top: 25px;
    }

    @media (max-width: 1000px) {
      .product-row { grid-template-columns: 25px 1fr 1fr; }
      .product-row input:nth-of-type(n+3) { grid-column: span 2; }
    }
  </style>
</head>

<body>
  <!-- VIEW: LOGIN -->
  <section id="view-login" class="view-section active">
    <div class="login-card">
      <h2>Apple Fulfillment Monitor</h2>
      <p>เข้าสู่ระบบเพื่อดูสถานะ Pickup</p>

      <label>Username</label>
      <input id="loginUsername" type="text" autocomplete="username">

      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password">

      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Login</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </section>

  <div id="app" style="display:none;">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">Apple Fulfillment Monitor</div>

        <div class="nav-tabs">
          <button class="nav-tab active" onclick="switchView('dashboard')">หน้าหลัก</button>
          <button class="nav-tab" onclick="switchView('config')">ตั้งค่าระบบ</button>
        </div>

        <div class="control">
          <span>Refresh</span>
          <select id="refreshSelect" onchange="changeRefresh()">
            <option value="10">10 sec</option>
            <option value="30" selected>30 sec</option>
            <option value="60">60 sec</option>
          </select>
        </div>

        <div class="control">
          <span>ZIP</span>
          <input id="location" type="text" value="10140" style="width:75px" onchange="saveLocationOnly()">
        </div>

        <button class="btn btn-secondary" onclick="fetchNow()">↻ Refresh</button>
        <button class="btn btn-secondary" onclick="doLogout()">ออกจากระบบ</button>
        <span id="status" class="status-pill">กำลังโหลด...</span>
      </div>
    </header>

    <main>
      <!-- VIEW: DASHBOARD -->
      <section id="view-dashboard" class="view-section active">
        <div class="hero">
          <h1>Check availability.</h1>
          <p>ติดตามสถานะ Pickup แยกตามรุ่นแบบเรียลไทม์</p>
        </div>
        <div id="dashboard" class="dashboard"></div>
      </section>

      <!-- VIEW: CONFIG -->
      <section id="view-config" class="view-section">
        <div class="editor-container">
          <h2>Product Settings</h2>
          <p>จัดการรุ่นสินค้า รหัส Part Number รูปภาพ ลิงก์เมื่อคลิก และข้อความทับรูป</p>

          <div id="productEditor"></div>

          <div style="display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;">
            <button class="btn btn-secondary" onclick="addProduct()">+ เพิ่มสินค้า</button>
            <button class="btn btn-primary" onclick="saveConfig()">บันทึกการตั้งค่าทั้งหมด</button>
          </div>
        </div>
      </section>

      <div class="footer-note">
        Last update: <span id="lastUpdate">-</span>
      </div>
    </main>
  </div>

<script>
  let config = { location: '10140', products: [] };
  let refreshTimer = null;
  let refreshSeconds = 30;
  let loading = false;
  let sessionToken = null;

  document.addEventListener('DOMContentLoaded', () => {
    sessionToken = sessionStorage.getItem('sessionToken');
    if (sessionToken) {
      enterApp();
    } else {
      showLogin();
    }
  });

  // ---------- Login / session ----------

  function showLogin(message) {
    if (refreshTimer) clearInterval(refreshTimer);
    sessionToken = null;
    sessionStorage.removeItem('sessionToken');
    document.getElementById('app').style.display = 'none';
    document.getElementById('view-login').classList.add('active');
    const err = document.getElementById('loginError');
    if (message) {
      err.textContent = message;
      err.style.display = 'block';
    } else {
      err.style.display = 'none';
    }
  }

  function enterApp() {
    document.getElementById('view-login').classList.remove('active');
    document.getElementById('app').style.display = 'block';
    loadConfig();
  }

  function doLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.style.display = 'none';

    if (!username || !password) {
      err.textContent = 'กรุณากรอก Username และ Password';
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        sessionToken = res.token;
        sessionStorage.setItem('sessionToken', sessionToken);
        document.getElementById('loginPassword').value = '';
        enterApp();
      })
      .withFailureHandler(e => {
        btn.disabled = false;
        err.textContent = 'Login ไม่สำเร็จ: ' + (e && e.message ? e.message : e);
        err.style.display = 'block';
      })
      .login(username, password);
  }

  function doLogout() {
    if (refreshTimer) clearInterval(refreshTimer);
    const token = sessionToken;
    showLogin();
    if (token) {
      google.script.run
        .withSuccessHandler(() => {})
        .withFailureHandler(() => {})
        .logout(token);
    }
  }

  // Treat this uniformly for every google.script.run failure handler: if the
  // server says our session was replaced, drop back to the login screen
  // instead of showing a generic error.
  function handleServerError(err, fallbackStatus) {
    const message = err && err.message ? err.message : String(err);
    if (message.indexOf('SESSION_REPLACED') !== -1) {
      showLogin('Session ถูกแทนที่ / มีการ Login จากที่อื่น กรุณาเข้าสู่ระบบใหม่');
      return;
    }
    setStatus(fallbackStatus);
    console.error(err);
  }

  // ---------- View switching ----------

  function switchView(viewName) {
    document.querySelectorAll('#app .view-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

    if (viewName === 'dashboard') {
      document.getElementById('view-dashboard').classList.add('active');
      document.querySelectorAll('.nav-tab')[0].classList.add('active');
    } else {
      document.getElementById('view-config').classList.add('active');
      document.querySelectorAll('.nav-tab')[1].classList.add('active');
    }
  }

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  // ---------- Config ----------

  function loadConfig() {
    setStatus('กำลังโหลด config...');
    google.script.run
      .withSuccessHandler(data => {
        config = data || { location: '10140', products: [] };
        document.getElementById('location').value = config.location || '10140';
        renderEditor();
        fetchNow();
      })
      .withFailureHandler(err => handleServerError(err, 'Config error'))
      .getConfig(sessionToken);
  }

  function renderEditor() {
    const root = document.getElementById('productEditor');
    root.innerHTML = '';

    if (!config.products.length) {
      root.innerHTML = '<div style="color:#6e6e73;padding:10px 0;">ยังไม่มีสินค้า กดปุ่ม + เพิ่มสินค้า ด้านล่าง</div>';
      return;
    }

    config.products.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <input type="checkbox" ${p.enabled !== false ? 'checked' : ''} title="เปิดใช้งาน" onchange="config.products[${i}].enabled=this.checked">
        <input type="text" placeholder="ชื่อสินค้า" value="${escAttr(p.productName || '')}" oninput="config.products[${i}].productName=this.value">
        <input type="text" placeholder="Part Number (เช่น MJY34ZP/A)" value="${escAttr(p.partNumber || '')}" oninput="config.products[${i}].partNumber=this.value.toUpperCase()">
        <input type="url" placeholder="Image URL" value="${escAttr(p.imageUrl || '')}" oninput="config.products[${i}].imageUrl=this.value">
        <input type="url" placeholder="Link URL เมื่อคลิกรูป" value="${escAttr(p.linkUrl || '')}" oninput="config.products[${i}].linkUrl=this.value">
        <input type="text" placeholder="ข้อความบนรูป (เช่น NEW)" value="${escAttr(p.overlayText || '')}" oninput="config.products[${i}].overlayText=this.value">
        <button class="btn btn-danger" onclick="removeProduct(${i})">ลบ</button>
      `;
      root.appendChild(row);
    });
  }

  function addProduct() {
    config.products.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      productName: '',
      partNumber: '',
      imageUrl: '',
      linkUrl: '',
      overlayText: '',
      enabled: true,
      lastFoundAt: '',
      lastUnfoundAt: ''
    });
    renderEditor();
  }

  function removeProduct(index) {
    config.products.splice(index, 1);
    renderEditor();
  }

  function saveLocationOnly() {
    config.location = document.getElementById('location').value.trim() || '10140';
    saveConfig(true);
  }

  function saveConfig(silent) {
    config.location = document.getElementById('location').value.trim() || '10140';
    setStatus('กำลังบันทึก...');
    google.script.run
      .withSuccessHandler(data => {
        config = data;
        renderEditor();
        setStatus('บันทึกเรียบร้อย');
        if (!silent) fetchNow();
      })
      .withFailureHandler(err => handleServerError(err, 'Save error'))
      .saveConfig(sessionToken, config);
  }

  // ---------- Stock refresh ----------

  function changeRefresh() {
    refreshSeconds = Number(document.getElementById('refreshSelect').value);
    startRefreshTimer();
    setStatus(`Auto refresh ${refreshSeconds}s`);
  }

  function startRefreshTimer() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      if (!loading) fetchNow();
    }, refreshSeconds * 1000);
  }

  function fetchNow() {
    if (loading || !sessionToken) return;

    const active = config.products.filter(p => p.enabled !== false && p.partNumber);
    if (!active.length) {
      renderDashboard([]);
      setStatus('ยังไม่มีรุ่นที่เปิดใช้งาน');
      startRefreshTimer();
      return;
    }

    loading = true;
    setStatus('กำลังเช็กสต็อก Apple...');

    // The server re-validates sessionToken before calling Apple, writing
    // logs, or updating ProductStatus — this call is not itself the
    // security boundary, it just carries the token.
    google.script.run
      .withSuccessHandler(response => {
        loading = false;
        config = response.config || config;
        renderDashboard(response.results || []);
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString('th-TH');

        const errors = (response.results || []).filter(r => r.status === 'error');
        setStatus(errors.length ? `อัปเดตแล้ว • ${errors.length} รุ่นมี Error` : `อัปเดตแล้ว • ${response.results.length} รุ่น`);
        startRefreshTimer();
      })
      .withFailureHandler(err => {
        loading = false;
        handleServerError(err, 'Fetch error');
        startRefreshTimer();
      })
      .fetchAllStock(sessionToken, config.location, config.products);
  }

  function renderDashboard(results) {
    const root = document.getElementById('dashboard');
    root.innerHTML = '';

    if (!results.length) {
      root.innerHTML = '<div class="empty" style="grid-column:1/-1;text-align:center;color:#6e6e73;padding:40px;">ยังไม่มีข้อมูลสินค้าสำหรับแสดงผล</div>';
      return;
    }

    results.forEach(r => {
      const card = document.createElement('article');
      card.className = 'card';

      const available = (r.data || []).filter(s => s.isAvailable);
      const hasData = (r.data || []).length > 0;

      let dotClass = 'orange';
      let statusText = 'ไม่พบข้อมูล';

      if (r.status === 'error') {
        dotClass = 'red';
        statusText = r.message || 'Apple API Error';
      } else if (available.length) {
        dotClass = 'green';
        statusText = `มีสินค้า ${available.length} สาขา`;
      } else if (hasData) {
        dotClass = 'red';
        statusText = 'ยังไม่มีสาขาที่พร้อมรับสินค้า';
      } else {
        dotClass = 'orange';
        statusText = 'API สำเร็จ แต่ไม่พบข้อมูลสาขา';
      }

      const imgTag = r.imageUrl
        ? `<img src="${escAttr(r.imageUrl)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><div class="image-placeholder" style="display:none">โหลดรูปไม่ได้</div>`
        : `<div class="image-placeholder">No image</div>`;

      const imageHtml = r.linkUrl
        ? `<a href="${escAttr(r.linkUrl)}" target="_blank" title="คลิกเพื่อเปิดลิงก์">${imgTag}</a>`
        : imgTag;

      card.innerHTML = `
        <div class="product-image">
          ${imageHtml}
          ${r.overlayText ? `<div class="overlay">${escHtml(r.overlayText)}</div>` : ''}
        </div>

        <div class="card-body">
          <div class="product-name">${escHtml(r.productName)}</div>
          <div class="sku">${escHtml(r.partNumber)}</div>

          <div class="history-info">
            <div>🟢 ล่าสุดที่พบของ: <strong>${r.lastFoundAt ? new Date(r.lastFoundAt).toLocaleString('th-TH') : 'ยังไม่เคยพบ'}</strong></div>
            <div>🔴 ล่าสุดที่ไม่พบ: <strong>${r.lastUnfoundAt ? new Date(r.lastUnfoundAt).toLocaleString('th-TH') : 'ยังไม่เคยบันทึก'}</strong></div>
          </div>

          <div class="availability">
            <span class="dot ${dotClass}"></span>
            <span>${escHtml(statusText)}</span>
          </div>

          <div class="stores">
             ${(r.data || []).map(s => `
              <div class="store">
                <div class="store-name">${escHtml(s.storeName)}</div>
                <div class="store-status">
                  ${s.isAvailable ? 'Available' : escHtml(s.quote || s.pickupDisplay || 'Unavailable')}
                </div>
              </div>
            `).join('')}
          </div>

          ${r.status === 'error' ? `<div style="color:#ff3b30;font-size:12px;margin-top:12px;">${escHtml(r.message || '')}</div>` : ''}
        </div>
      `;

      root.appendChild(card);
    });
  }

  function escHtml(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function escAttr(value) { return escHtml(value); }
</script>
